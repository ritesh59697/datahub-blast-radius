[project]
name = "blast-radius"
version = "0.1.0"
description = "Report the real downstream impact of a data schema change, using DataHub lineage."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
blast-radius = "blast_radius.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blast_radius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
